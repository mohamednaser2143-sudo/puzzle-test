<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 20 Locks</title>
<style>
:root{--bg:#10151c;--panel:#18202b;--ink:#e9eef5;--dim:#8a97a8;--line:#2a3646;--gold:#e8b64c;--bad:#e5645a;--chip:#25324a;--good:#4ec9b0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:680px}
h1{font-size:2rem;margin:.2em 0 .1em}
.sub{color:var(--dim);margin:0 0 24px;line-height:1.5}
.bar{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-bottom:24px}
.bar i{height:8px;border-radius:2px;background:var(--line)}
.bar i.done{background:var(--gold)}
.bar i.now{background:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
.lvl{color:var(--gold);font-size:.95rem;margin:0 0 6px}
h2{margin:0 0 14px;font-size:1.35rem}
.q{font-size:1.12rem;line-height:1.55;margin:0 0 8px}
.ai{font-size:.85rem;line-height:1.45;color:var(--dim);margin:0 0 14px}
.note{color:var(--dim);margin:0 0 14px;font-style:italic}
input{width:100%;padding:14px;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px}
textarea{width:100%;min-height:220px;padding:14px;font:inherit;font-size:1.05rem;line-height:1.5;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
input.name{margin-bottom:12px}
.count{color:var(--dim);margin:6px 0 0;font-size:.9rem}

button{margin-top:16px;width:100%;padding:14px;font:inherit;font-size:1.1rem;font-weight:bold;color:#1a1305;background:var(--gold);border:0;border-radius:8px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{color:var(--bad);min-height:1.4em;margin:10px 0 0}
.fail{border-color:var(--bad)}
.big{font-size:1.6rem;margin:0 0 10px}
.fail .big{color:var(--bad)}
.final{font-size:1.7rem;line-height:1.4;color:var(--gold);word-break:break-word}
.slots,.buckets{display:grid;gap:8px;margin-bottom:12px}
.buckets{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px;border:2px dashed var(--line);border-radius:8px}
.slot .num{color:var(--gold);width:1.4em;flex:none}
.bucket{min-height:90px;padding:8px;border:2px dashed var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.bucket .bl{width:100%;color:var(--gold);font-size:.95rem;margin-bottom:2px}
.pool{min-height:64px;padding:8px;border:2px solid var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg)}
.chip{padding:9px 14px;background:var(--chip);border:2px solid transparent;border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:1.05rem}
.chip.sel{border-color:var(--gold)}
.chip.lift{opacity:.3}
.chip.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 8px 24px #0009;opacity:.95}

/* Admin Modal Styling */
#adminModal{display:none;position:fixed;inset:0;background:#000c;z-index:999;justify-content:center;align-items:center;padding:16px}
.admin-box{background:var(--panel);border:2px solid var(--gold);border-radius:12px;width:100%;max-width:700px;max-height:85vh;overflow-y:auto;padding:24px}
.sub-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.sub-meta{font-size:.85rem;color:var(--dim);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:10px}
.sub-text{font-size:1rem;line-height:1.4;white-space:pre-wrap;margin-bottom:10px}
.admin-actions{display:flex;gap:10px}
.admin-actions button{margin-top:0;padding:8px 14px;font-size:.9rem}
.btn-acc{background:var(--good);color:#0a1a15}
.btn-rej{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}}
</style>
<!-- EmailJS Library -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<main>
<h1>The 20 Locks</h1>
<p class="sub">Solve all 20 puzzles in a row. One wrong answer and you go back to level 1.</p>

</main>

<script>

const EMAILJS_SERVICE_ID = "service_shnnu1o";
const EMAILJS_TEMPLATE_ID = "template_wghkza5";
const EMAILJS_PUBLIC_KEY = "m4soiDip8C5yRne12";

// Initialize EmailJS
(function(){emailjs.init(EMAILJS_PUBLIC_KEY);})();

// Secret Keylogger for "admin"
let keyBuffer="";
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  keyBuffer+=e.key.toLowerCase();
  if(keyBuffer.length>10)keyBuffer=keyBuffer.slice(-10);

function triggerAdminLogin(){
  const email=prompt("Admin Access Detected. Enter admin email:");
  if(email!==ADMIN_EMAIL){alert("Unauthorized email.");return;}
  
  const code=Math.floor(100000+Math.random()*900000).toString();
  alert("Sending verification code to "+ADMIN_EMAIL+"...");
  
  emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{code:code,to_email:ADMIN_EMAIL})
    .then(()=>{
      const entered=prompt("Email sent! Check your inbox. Enter the 6-digit code:");
      if(entered===code){
        openAdminPanel();
      }else{
        alert("Incorrect code.");
      }
    },err=>{alert("Failed to send email. Check EmailJS configuration.");});
}

function openAdminPanel(){
  document.getElementById("adminModal").style.display="flex";
  const list=document.getElementById("adminList");
  let subs=JSON.parse(localStorage.getItem("lock_essays")||"[]");
  
  if(subs.length===0){
    list.innerHTML=`<p class="note">No submissions found on this device yet.</p>`;
    return;
  }
  
  list.innerHTML="";
  subs.forEach((sub,idx)=>{
    const div=document.createElement("div");
    div.className="sub-card";
    div.innerHTML=`
      <div class="sub-meta">
        <span><b>Player:</b> ${esc(sub.name)}</span>
        <span><b>Words:</b> ${sub.words}</span>
        <span><b>Time:</b> ${sub.seconds}s</span>
        <span><b>Pastes:</b> ${sub.pastes} (${sub.pastedChars} chars)</span>
        <span><b>Keys:</b> ${sub.keys}</span>
        <span><b>Tab Switches:</b> ${sub.tabs}</span>
        <span><b>Status:</b> <b style="color:${sub.status==='accepted'?'var(--good)':sub.status==='rejected'?'var(--bad)':'var(--gold)'}">${sub.status.toUpperCase()}</b></span>
      </div>
      <div class="sub-text">${esc(sub.essay)}</div>
      <div class="admin-actions">
        <button class="btn-acc" onclick="setSubStatus(${idx},'accepted')">Accept</button>
        <button class="btn-rej" onclick="setSubStatus(${idx},'rejected')">Reject</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function setSubStatus(idx,st){
  let subs=JSON.parse(localStorage.getItem("lock_essays")||"[]");
  if(subs[idx]){
    subs[idx].status=st;
    localStorage.setItem("lock_essays",JSON.stringify(subs));
    openAdminPanel();
  }
}

const P=[

const MSG="c2VuZCB0aGlzIHRvIG1vaGFtZWQgNzc4ODIyODU=";
let stats={start:0,keys:0,pastes:0,pastedChars:0,tabs:0},pollInterval=null;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"&&P[lvl].k==="essay")stats.tabs++});
let lvl=0,state="play",loc={},sel=null,justDragged=false,subId="";
const card=document.getElementById("card"),bar=document.getElementById("bar");

function hash(s){
  s=s.toLowerCase().replace(/[\s,.]+/g,"");
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=Math.imul(h1^c,2654435761)>>>0;
    h2=Math.imul(h2^c,1597334677)>>>0;
  }
  h1=((Math.imul((h1^(h1>>>16))>>>0,2246822507)>>>0)^(Math.imul((h2^(h2>>>13))>>>0,3266489909)>>>0))>>>0;
  h2=((Math.imul((h2^(h2>>>16))>>>0,2246822507)>>>0)^(Math.imul((h1^(h1>>>13))>>>0,3266489909)>>>0))>>>0;
  return h2.toString(16).padStart(8,"0")+h1.toString(16).padStart(8,"0");
}
function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}
function drawBar(){
  bar.innerHTML="";
  for(let i=0;i<20;i++){
    const e=document.createElement("i");
    if(state==="clear"||state==="end"||i<lvl)e.className="done";
    else if(i===lvl&&state==="play"||state==="pending")e.className="now";
    bar.appendChild(e);
  }
}
function head(p){
  return `<p class="lvl">Level ${lvl+1} of 20</p><h2>${esc(p.t)}</h2><p class="q">${esc(p.q)}</p><p class="ai">${esc(p.a)}</p>`+(p.n?`<p class="note">${esc(p.n)}</p>`:"");
}
function render(){
  drawBar();
  card.className="card";
  sel=null;
  if(pollInterval){clearInterval(pollInterval);pollInterval=null;}

  if(state==="play"){
    const p=P[lvl];
    if(p.k==="text"){
      card.innerHTML=head(p)+`<input id="a" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="Your answer"><p class="msg" id="msg"></p><button id="next">Next</button>`;
      const a=document.getElementById("a");a.focus();
      const go=()=>{if(a.value.trim())judge(p.h.includes(hash(a.value)))};
      document.getElementById("next").onclick=go;
      a.onkeydown=e=>{if(e.key==="Enter")go()};
    }else if(p.k==="essay"){
      stats={start:0,keys:0,pastes:0,pastedChars:0,tabs:0};
      card.innerHTML=head(p)+`<input id="nm" class="name" type="text" maxlength="60" autocomplete="off" aria-label="Your name" placeholder="Your name"><textarea id="es" aria-label="Your essay" placeholder="Start writing here..."></textarea><p class="count" id="ct">0 words (80 needed)</p><p class="msg" id="msg"></p><button id="next">Submit for Review</button>`;
      const es=document.getElementById("es"),nm=document.getElementById("nm"),ct=document.getElementById("ct");
      const words=()=>es.value.trim().split(/\s+/).filter(Boolean).length;
      const mark=()=>{if(!stats.start)stats.start=Date.now()};
      es.addEventListener("focus",mark);
      es.addEventListener("keydown",()=>{mark();stats.keys++});
      es.addEventListener("paste",e=>{mark();stats.pastes++;const t=(e.clipboardData||window.clipboardData).getData("text")||"";stats.pastedChars+=t.length});
      es.addEventListener("drop",e=>{stats.pastes++;stats.pastedChars+=((e.dataTransfer&&e.dataTransfer.getData("text"))||"").length});
      es.addEventListener("input",()=>{ct.textContent=words()+" words (80 needed)"});
      document.getElementById("next").onclick=()=>{
        if(!nm.value.trim()){msg("Type your name first.");return}
        if(words()<80){msg("Write at least 80 words. You have "+words()+".");return}
        subId="sub_"+Date.now();
        
        let subs=JSON.parse(localStorage.getItem("lock_essays")||"[]");
        const newSub={
          id:subId,
          name:nm.value.trim(),
          essay:es.value,
          words:words(),
          seconds:stats.start?Math.round((Date.now()-stats.start)/1000):0,
          pastes:stats.pastes,
          pastedChars:stats.pastedChars,
          keys:stats.keys,
          tabs:stats.tabs,
          status:"pending"
        };
        subs.push(newSub);
        localStorage.setItem("lock_essays",JSON.stringify(subs));
        
        state="pending";
        card.innerHTML=`<p class="big">Waiting for Review...</p><p class="q">Your essay has been submitted! Type <b>admin</b> on your keyboard anywhere to review and accept/reject submissions.</p><p class="msg" id="msg">Checking status...</p>`;

        pollInterval=setInterval(()=>{
          let currentSubs=JSON.parse(localStorage.getItem("lock_essays")||"[]");
          let mine=currentSubs.find(s=>s.id===subId);
          if(mine){
            if(mine.status==="accepted"){
              clearInterval(pollInterval);
              judge(true);
            }else if(mine.status==="rejected"){
              clearInterval(pollInterval);
              judge(false);
            }
          }
        },2000);
      };
    }else{
      loc={};p.items.forEach(it=>loc[it.id]="pool");
      card.innerHTML=head(p)+`<div id="area"></div><p class="msg" id="msg"></p><button id="next">Next</button>`;
      paint();
      document.getElementById("next").onclick=()=>{
        const out=[];
        if(p.k==="order"){
          for(let i=0;i<p.items.length;i++){
            const id=Object.keys(loc).find(k=>loc[k]==="s"+i);
            if(!id){msg("Fill every slot first.");return}
            out.push(id);
          }
        }else{
          for(const it of p.items){
            if(loc[it.id]==="pool"){msg("Place every item in a box first.");return}
            out.push(it.id+":"+loc[it.id].slice(1));
          }
        }
        judge(p.h.includes(hash(out.join("-"))));
      };
    }
  }else if(state==="fail"){
    card.className="card fail shake";
    card.innerHTML=`<p class="big">Wrong answer / Rejected.</p><p class="q">Your essay was rejected or an answer was wrong on level ${lvl+1}. Everything resets and you start again from level 1.</p><button id="again">Start over</button>`;
    const b=document.getElementById("again");b.onclick=()=>{lvl=0;state="play";render()};b.focus();
  }else if(state==="clear"){
    card.innerHTML=`<p class="big">All 20 solved.</p><p class="q">You cleared every lock successfully.</p><button id="fin">Next</button>`;
    const b=document.getElementById("fin");b.onclick=()=>{state="end";render()};b.focus();
  }else{
    card.innerHTML=`<p class="final">${esc(atob(MSG))}</p>`;
  }
}
function msg(t){document.getElementById("msg").textContent=t}
function judge(ok){
  if(ok){lvl++;if(lvl>=20){lvl=20;state="clear"}else state="play"}
  else state="fail";
  render();
}
function chip(it){
  const c=el("div","chip"+(sel===it.id?" sel":""));
  c.textContent=it.l;c.dataset.id=it.id;
  c.addEventListener("pointerdown",e=>down(e,it.id,c));
  return c;
}
function paint(){
  const p=P[lvl],area=document.getElementById("area");
  area.innerHTML="";
  const byLoc=t=>p.items.filter(it=>loc[it.id]===t);
  const target=(node,t)=>{node.dataset.target=t;node.addEventListener("click",()=>{
    if(justDragged||!sel)return;place(sel,t);sel=null;paint()});return node};
  if(p.k==="order"){
    const wrap=el("div","slots");
    p.items.forEach((_,i)=>{
      const s=target(el("div","slot"),"s"+i);
      const n=el("span","num");n.textContent=(i+1)+".";s.appendChild(n);
      byLoc("s"+i).forEach(it=>s.appendChild(chip(it)));
      wrap.appendChild(s);
    });
    area.appendChild(wrap);
  }else{
    const wrap=el("div","buckets");
    p.buckets.forEach((b,i)=>{
      const d=target(el("div","bucket"),"b"+i);
      const l=el("div","bl");l.textContent=b;d.appendChild(l);
      byLoc("b"+i).forEach(it=>d.appendChild(chip(it)));
      wrap.appendChild(d);
    });
    area.appendChild(wrap);
  }
  const pool=target(el("div","pool"),"pool");
  byLoc("pool").forEach(it=>pool.appendChild(chip(it)));
  area.appendChild(pool);
}
function place(id,t){
  const old=loc[id];
  if(t[0]==="s"){
    const occ=Object.keys(loc).find(k=>loc[k]===t&&k!==id);
    if(occ)loc[occ]=old[0]==="s"?old:"pool";
  }
  loc[id]=t;
}
function down(e,id,chipEl){
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
      moved=true;ghost=chipEl.cloneNode(true);ghost.className="chip ghost";
      document.body.appendChild(ghost);chipEl.classList.add("lift");
    }
    if(ghost){ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px"}
  };
  const up=ev=>{
    window.removeEventListener("pointermove",mv);
    window.removeEventListener("pointerup",up);
    window.removeEventListener("pointercancel",up);
    justDragged=true;setTimeout(()=>{justDragged=false},0);
    if(ghost)ghost.remove();
    if(moved){
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      const tg=t&&t.closest("[data-target]");
      if(tg)place(id,tg.dataset.target);
      sel=null;
    }else{
      sel=(sel===id)?null:id;
    }
    paint();
  };
  window.addEventListener("pointermove",mv);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
}
render();
</script>
</body>
</html>
